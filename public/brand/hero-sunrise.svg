<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="sunrise-title sunrise-desc" preserveAspectRatio="xMidYMid slice">
  <title id="sunrise-title">গ্রামের পথে সূর্যোদয় — নতুন দিনের প্রতিশ্রুতি</title>
  <desc id="sunrise-desc">Sunrise over a Bengali village road, symbolizing a new beginning and freedom from smoking. A memorial to Abdul Karim (raḥimahullāh).</desc>

  <defs>
    <!-- ═══════════════════════════════════════════════════════════
         SKY GRADIENTS — three stages of dawn
         ═══════════════════════════════════════════════════════════ -->
    <linearGradient id="sky-dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="45%" stop-color="#1b2744"/>
      <stop offset="80%" stop-color="#3a2e52"/>
      <stop offset="100%" stop-color="#5a3a4a"/>
    </linearGradient>

    <linearGradient id="sky-sunrise" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3b5f"/>
      <stop offset="35%" stop-color="#a85f4a"/>
      <stop offset="65%" stop-color="#e89c5a"/>
      <stop offset="90%" stop-color="#f5c879"/>
      <stop offset="100%" stop-color="#ffd99a"/>
    </linearGradient>

    <linearGradient id="sky-morning" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ab0d4"/>
      <stop offset="55%" stop-color="#f4d49a"/>
      <stop offset="100%" stop-color="#ffe9bf"/>
    </linearGradient>

    <!-- ═══════════════════════════════════════════════════════════
         SUN — body, halo, rays
         ═══════════════════════════════════════════════════════════ -->
    <radialGradient id="sun-halo-grad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff5d9" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#ffe08a" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#f5a623" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d4a017" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sun-body-grad" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fff5d9"/>
      <stop offset="100%" stop-color="#ffe08a"/>
    </radialGradient>

    <!-- ═══════════════════════════════════════════════════════════
         MOUNTAINS + GROUND — layered depth
         ═══════════════════════════════════════════════════════════ -->
    <linearGradient id="mountain-far-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a4a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f2838" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="mountain-mid-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f5132"/>
      <stop offset="100%" stop-color="#0a2a1a"/>
    </linearGradient>

    <linearGradient id="ground-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3d22"/>
      <stop offset="100%" stop-color="#050d07"/>
    </linearGradient>

    <linearGradient id="road-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4b890" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#9a8566" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#4a3d2a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Soft mist gradient -->
    <linearGradient id="mist-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Horizon glow (hot spot where sun breaks) -->
    <radialGradient id="horizon-glow" cx="0.5" cy="1" r="0.6">
      <stop offset="0%" stop-color="#ffd99a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f5a623" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>

    <!-- Single sun ray template -->
    <linearGradient id="ray-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5d9" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ffe08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fff5d9" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Tree silhouette reusable symbol -->
    <symbol id="tree-a" viewBox="0 0 60 90">
      <rect x="27" y="55" width="6" height="35" fill="#0a1e10"/>
      <ellipse cx="30" cy="35" rx="28" ry="35" fill="#0a1e10"/>
      <ellipse cx="18" cy="45" rx="14" ry="18" fill="#050d07"/>
      <ellipse cx="42" cy="48" rx="13" ry="17" fill="#050d07"/>
    </symbol>

    <symbol id="tree-b" viewBox="0 0 50 100">
      <rect x="23" y="60" width="4" height="40" fill="#0a1e10"/>
      <path d="M25,5 L5,55 L18,55 L2,85 L48,85 L32,55 L45,55 Z" fill="#0a1e10"/>
      <path d="M25,15 L12,50 L20,50 L10,75 L40,75 L30,50 L38,50 Z" fill="#050d07" opacity="0.6"/>
    </symbol>

    <!-- Bird removed — Islamic adab: no living beings -->
  </defs>

  <!-- ═══════════════════════════════════════════════════════════════
       INLINE STYLES — 9-second seamless loop animations
       ═══════════════════════════════════════════════════════════════ -->
  <style type="text/css"><![CDATA[
    /* Full cycle = 9s. Each layer fades in/out at its timing. */
    .sky-dawn    { animation: dawn 9s ease-in-out infinite; }
    .sky-sunrise { animation: sunrise 9s ease-in-out infinite; opacity: 0; }
    .sky-morning { animation: morning 9s ease-in-out infinite; opacity: 0; }

    .horizon-glow-layer { animation: glow 9s ease-in-out infinite; opacity: 0; transform-origin: 400px 560px; }

    .stars { animation: stars-fade 9s ease-in-out infinite; transform-origin: center; }
    .twinkle { animation: twinkle 3.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .t2 { animation-delay: -0.8s; }
    .t3 { animation-delay: -1.6s; }
    .t4 { animation-delay: -2.4s; }
    .t5 { animation-delay: -1.1s; }
    .t6 { animation-delay: -2.0s; }
    .t7 { animation-delay: -0.4s; }
    .t8 { animation-delay: -2.7s; }

    /* Sun rises from y=640 (hidden behind mountain) to y=370 (clear in sky) */
    .sun-group { animation: sun-rise 9s ease-in-out infinite; transform-origin: 400px 560px; }
    .sun-halo  { animation: halo-pulse 9s ease-in-out infinite; transform-origin: 400px 560px; }
    .sun-rays  { animation: rays-appear 9s ease-in-out infinite; transform-origin: 400px 560px; opacity: 0; }
    .sun-rays-rot { animation: rays-rotate 36s linear infinite; transform-origin: 400px 560px; }

    .mist-layer { animation: mist-drift 9s ease-in-out infinite; }
    .mist-a { animation: mist-a 18s ease-in-out infinite; }
    .mist-b { animation: mist-b 22s ease-in-out infinite; }

    .ground-layer { animation: ground-warm 9s ease-in-out infinite; }
    .road-layer   { animation: road-warm 9s ease-in-out infinite; }

    /* ─── Keyframes ─────────────────────────────────────────────── */
    @keyframes dawn {
      0%, 8%   { opacity: 1; }
      22%      { opacity: 0.55; }
      40%, 60% { opacity: 0; }
      78%      { opacity: 0.55; }
      92%, 100%{ opacity: 1; }
    }
    @keyframes sunrise {
      0%       { opacity: 0; }
      20%      { opacity: 0.6; }
      35%, 55% { opacity: 1; }
      72%      { opacity: 0.5; }
      88%,100% { opacity: 0; }
    }
    @keyframes morning {
      0%, 45%  { opacity: 0; }
      58%      { opacity: 0.7; }
      65%, 75% { opacity: 1; }
      85%,100% { opacity: 0; }
    }
    @keyframes glow {
      0%, 10%  { opacity: 0; transform: scale(0.6); }
      30%      { opacity: 0.6; transform: scale(1); }
      45%, 65% { opacity: 1; transform: scale(1.15); }
      80%      { opacity: 0.5; transform: scale(1); }
      95%,100% { opacity: 0; transform: scale(0.6); }
    }
    @keyframes stars-fade {
      0%, 10%  { opacity: 0.95; }
      25%      { opacity: 0.3; }
      40%, 70% { opacity: 0; }
      85%      { opacity: 0.3; }
      100%     { opacity: 0.95; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.95; transform: scale(1); }
      50%      { opacity: 0.35; transform: scale(0.6); }
    }

    @keyframes sun-rise {
      0%, 10%  { transform: translateY(80px) scale(0.85); }
      35%      { transform: translateY(20px) scale(0.95); }
      50%, 60% { transform: translateY(-70px) scale(1); }
      75%      { transform: translateY(-30px) scale(0.95); }
      90%,100% { transform: translateY(80px) scale(0.85); }
    }
    @keyframes halo-pulse {
      0%, 10%  { opacity: 0; transform: scale(0.7); }
      30%      { opacity: 0.6; transform: scale(1); }
      45%, 65% { opacity: 1; transform: scale(1.2); }
      80%      { opacity: 0.55; transform: scale(1); }
      95%,100% { opacity: 0; transform: scale(0.7); }
    }
    @keyframes rays-appear {
      0%, 28%  { opacity: 0; }
      45%      { opacity: 0.55; }
      55%, 65% { opacity: 0.85; }
      78%      { opacity: 0.4; }
      90%,100% { opacity: 0; }
    }
    @keyframes rays-rotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes mist-drift {
      0%, 10%  { opacity: 0.2; }
      30%      { opacity: 0.55; }
      50%      { opacity: 0.75; }
      70%      { opacity: 0.55; }
      90%,100% { opacity: 0.2; }
    }
    @keyframes mist-a {
      0%, 100% { transform: translateX(-40px); }
      50%      { transform: translateX(40px); }
    }
    @keyframes mist-b {
      0%, 100% { transform: translateX(30px); }
      50%      { transform: translateX(-50px); }
    }

    @keyframes ground-warm {
      0%, 15%  { filter: brightness(0.55) saturate(0.7); }
      50%      { filter: brightness(1) saturate(1.05); }
      85%,100% { filter: brightness(0.55) saturate(0.7); }
    }
    @keyframes road-warm {
      0%, 15%  { filter: brightness(0.4); }
      50%      { filter: brightness(1.08); }
      85%,100% { filter: brightness(0.4); }
    }

    /* ─── Respect prefers-reduced-motion ────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .sky-dawn, .sky-sunrise, .sky-morning,
      .horizon-glow-layer, .stars, .twinkle,
      .sun-group, .sun-halo, .sun-rays, .sun-rays-rot,
      .mist-layer, .mist-a, .mist-b,
      .ground-layer, .road-layer {
        animation: none !important;
      }
      .sky-dawn    { opacity: 0; }
      .sky-sunrise { opacity: 0; }
      .sky-morning { opacity: 1; }
      .stars       { opacity: 0; }
      .horizon-glow-layer { opacity: 1; transform: scale(1.1); }
      .sun-group   { transform: translateY(-60px); }
      .sun-halo    { opacity: 0.9; transform: scale(1.15); }
      .sun-rays    { opacity: 0.7; }
      .mist-layer  { opacity: 0.5; }
    }
  ]]></style>

  <!-- ═══════════════════════════════════════════════════════════════
       LAYER 1 — Sky (three stages stacked, fading between each)
       ═══════════════════════════════════════════════════════════════ -->
  <rect class="sky-dawn"    x="0" y="0" width="800" height="800" fill="url(#sky-dawn)"/>
  <rect class="sky-sunrise" x="0" y="0" width="800" height="800" fill="url(#sky-sunrise)"/>
  <rect class="sky-morning" x="0" y="0" width="800" height="800" fill="url(#sky-morning)"/>

  <!-- ═══════════════════════════════════════════════════════════════
       LAYER 2 — Stars (visible only at dawn)
       ═══════════════════════════════════════════════════════════════ -->
  <g class="stars">
    <circle class="twinkle t1" cx="80"  cy="90"  r="1.6" fill="#ffffff"/>
    <circle class="twinkle t2" cx="180" cy="50"  r="1.2" fill="#ffffff"/>
    <circle class="twinkle t3" cx="260" cy="120" r="1.8" fill="#ffffff"/>
    <circle class="twinkle t4" cx="360" cy="70"  r="1.3" fill="#ffffff"/>
    <circle class="twinkle t5" cx="450" cy="140" r="1.5" fill="#ffffff"/>
    <circle class="twinkle t6" cx="540" cy="60"  r="1.1" fill="#ffffff"/>
    <circle class="twinkle t7" cx="620" cy="110" r="1.7" fill="#ffffff"/>
    <circle class="twinkle t8" cx="720" cy="80"  r="1.3" fill="#ffffff"/>
    <circle class="twinkle t1" cx="140" cy="180" r="1.0" fill="#ffffff"/>
    <circle class="twinkle t3" cx="320" cy="210" r="0.9" fill="#ffffff"/>
    <circle class="twinkle t5" cx="500" cy="220" r="1.0" fill="#ffffff"/>
    <circle class="twinkle t7" cx="680" cy="200" r="1.2" fill="#ffffff"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════
       LAYER 3 — Horizon glow (where sun breaks through)
       ═══════════════════════════════════════════════════════════════ -->
  <ellipse class="horizon-glow-layer" cx="400" cy="560" rx="480" ry="220" fill="url(#horizon-glow)"/>

  <!-- ═══════════════════════════════════════════════════════════════
       LAYER 4 — Sun (halo + body + rays)
       ═══════════════════════════════════════════════════════════════ -->
  <g class="sun-group">
    <!-- Huge soft halo -->
    <circle class="sun-halo" cx="400" cy="560" r="280" fill="url(#sun-halo-grad)"/>
    <!-- Rays (rotating slowly) -->
    <g class="sun-rays">
      <g class="sun-rays-rot">
        <g opacity="0.7">
          <!-- 12 rays around the sun -->
          <path d="M400,420 L392,300 L408,300 Z" fill="url(#ray-grad)"/>
          <path d="M400,420 L392,300 L408,300 Z" fill="url(#ray-grad)" transform="rotate(30 400 560)"/>
          <path d="M400,420 L392,300 L408,300 Z" fill="url(#ray-grad)" transform="rotate(60 400 560)"/>
          <path d="M400,420 L392,300 L408,300 Z" fill="url(#ray-grad)" transform="rotate(90 400 560)"/>
          <path d="M400,420 L392,300 L408,300 Z" fill="url(#ray-grad)" transform="rotate(120 400 560)"/>
          <path d="M400,420 L392,300 L408,300 Z" fill="url(#ray-grad)" transform="rotate(150 400 560)"/>
          <path d="M400,420 L392,300 L408,300 Z" fill="url(#ray-grad)" transform="rotate(180 400 560)"/>
          <path d="M400,420 L392,300 L408,300 Z" fill="url(#ray-grad)" transform="rotate(210 400 560)"/>
          <path d="M400,420 L392,300 L408,300 Z" fill="url(#ray-grad)" transform="rotate(240 400 560)"/>
          <path d="M400,420 L392,300 L408,300 Z" fill="url(#ray-grad)" transform="rotate(270 400 560)"/>
          <path d="M400,420 L392,300 L408,300 Z" fill="url(#ray-grad)" transform="rotate(300 400 560)"/>
          <path d="M400,420 L392,300 L408,300 Z" fill="url(#ray-grad)" transform="rotate(330 400 560)"/>
        </g>
      </g>
    </g>
    <!-- Sun body -->
    <circle cx="400" cy="560" r="65" fill="url(#sun-body-grad)"/>
    <circle cx="400" cy="560" r="65" fill="none" stroke="#fff5d9" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════
       LAYER 5 — Distant mountain silhouette
       ═══════════════════════════════════════════════════════════════ -->
  <path fill="url(#mountain-far-grad)"
        d="M0,500 L60,470 L130,485 L210,445 L290,470 L370,430 L450,460 L530,420 L610,455 L690,435 L760,465 L800,450 L800,580 L0,580 Z"/>

  <!-- ═══════════════════════════════════════════════════════════════
       LAYER 6 — Mid mountain (darker, closer)
       ═══════════════════════════════════════════════════════════════ -->
  <path fill="url(#mountain-mid-grad)"
        d="M0,555 L90,500 L180,530 L270,490 L360,515 L440,495 L520,520 L610,500 L700,525 L800,510 L800,600 L0,600 Z"/>

  <!-- ═══════════════════════════════════════════════════════════════
       LAYER 7 — Mist ribbons (drifting)
       ═══════════════════════════════════════════════════════════════ -->
  <g class="mist-layer">
    <ellipse class="mist-a" cx="220" cy="555" rx="280" ry="22" fill="url(#mist-grad)"/>
    <ellipse class="mist-b" cx="580" cy="570" rx="240" ry="18" fill="url(#mist-grad)"/>
    <ellipse class="mist-a" cx="400" cy="585" rx="320" ry="14" fill="url(#mist-grad)" opacity="0.7"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════
       LAYER 8 — Ground (warms with sunrise)
       ═══════════════════════════════════════════════════════════════ -->
  <g class="ground-layer">
    <path fill="url(#ground-grad)" d="M0,595 L800,595 L800,800 L0,800 Z"/>

    <!-- Grass texture strokes -->
    <g opacity="0.35" stroke="#0a2a1a" stroke-width="1.2" stroke-linecap="round" fill="none">
      <path d="M30,640 L30,625 M50,650 L50,632 M75,645 L75,628 M110,660 L110,640 M140,655 L140,635"/>
      <path d="M170,670 L170,648 M210,680 L210,655 M250,690 L250,665 M290,700 L290,675"/>
      <path d="M510,700 L510,675 M550,690 L550,665 M590,680 L590,655 M630,670 L630,648"/>
      <path d="M670,660 L670,640 M710,650 L710,632 M745,645 L745,628 M770,640 L770,625"/>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════
       LAYER 9 — Village road (perspective → horizon)
       ═══════════════════════════════════════════════════════════════ -->
  <g class="road-layer">
    <!-- Road surface -->
    <path fill="url(#road-grad)" d="M400,590 L480,800 L320,800 Z"/>

    <!-- Road edges (lighter ruts) -->
    <path stroke="#c9b48d" stroke-width="2" fill="none" opacity="0.5" d="M400,590 L480,800"/>
    <path stroke="#c9b48d" stroke-width="2" fill="none" opacity="0.5" d="M400,590 L320,800"/>

    <!-- Centerline dashes (perspective: grow as they approach viewer) -->
    <g fill="#f4e8c8" opacity="0.85">
      <rect x="399" y="605" width="2"  height="6"  rx="1"/>
      <rect x="398" y="625" width="4"  height="9"  rx="1"/>
      <rect x="397" y="655" width="6"  height="13" rx="1.5"/>
      <rect x="395" y="695" width="10" height="18" rx="2"/>
      <rect x="392" y="745" width="16" height="25" rx="2"/>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════
       LAYER 10 — Trees (foreground silhouettes)
       ═══════════════════════════════════════════════════════════════ -->
  <g>
    <!-- Left cluster -->
    <use href="#tree-a" x="10"  y="500" width="80"  height="120"/>
    <use href="#tree-b" x="80"  y="520" width="55"  height="110"/>
    <use href="#tree-a" x="130" y="515" width="70"  height="110"/>
    <use href="#tree-b" x="195" y="535" width="45"  height="95"/>

    <!-- Right cluster -->
    <use href="#tree-b" x="560" y="530" width="50"  height="100"/>
    <use href="#tree-a" x="605" y="510" width="75"  height="115"/>
    <use href="#tree-b" x="675" y="525" width="55"  height="105"/>
    <use href="#tree-a" x="720" y="500" width="80"  height="125"/>

    <!-- Distant small trees (behind mist, on mid-ground) -->
    <g opacity="0.75">
      <use href="#tree-a" x="250" y="560" width="24" height="38"/>
      <use href="#tree-b" x="290" y="565" width="18" height="32"/>
      <use href="#tree-a" x="480" y="558" width="26" height="40"/>
      <use href="#tree-b" x="520" y="562" width="20" height="36"/>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════
       LAYER 11 — Foreground vignette (gently darkens edges)
       ═══════════════════════════════════════════════════════════════ -->
  <radialGradient id="vignette" cx="0.5" cy="0.55" r="0.75">
    <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
  </radialGradient>
  <rect x="0" y="0" width="800" height="800" fill="url(#vignette)" pointer-events="none"/>
</svg>
