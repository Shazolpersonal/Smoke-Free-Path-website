  <rect width="64" height="64" rx="14" fill="url(#mk-emerald)"/>
  <!-- Gold outline ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#mk-gold)" stroke-opacity="0.55" stroke-width="1.4"/>
  <!-- Gold plus -->
  <rect x="18" y="30.25" width="28" height="3.5" rx="1.7" fill="url(#mk-gold)"/>
