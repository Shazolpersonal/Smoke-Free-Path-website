<?xml version="1.0" encoding="UTF-8"?>
<!--
  ধোঁয়া-মুক্ত পথ :: মুহূর্ত ব্রেথ (App 1)
  Portrait demo poster — 9:16 (1080×1920)
  Concept: calming breath • emerald→deep teal • 21 seconds of peace
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920"
     font-family="Hind Siliguri, Noto Sans Bengali, Lohit Bengali, sans-serif">

  <!-- Gradient + pattern defs -->
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B3B36"/>
      <stop offset="55%" stop-color="#116254"/>
      <stop offset="100%" stop-color="#1A8E7A"/>
    </linearGradient>

    <radialGradient id="glow1" cx="50%" cy="58%" r="55%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#C9A96E" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <pattern id="geo1" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M60 0 L120 60 L60 120 L0 60 Z" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5"/>
      <circle cx="60" cy="60" r="30" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.2"/>
    </pattern>

    <filter id="soft1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Background layers -->
  <rect width="1080" height="1920" fill="url(#bg1)"/>
  <rect width="1080" height="1920" fill="url(#geo1)"/>
  <rect width="1080" height="1920" fill="url(#glow1)"/>

  <!-- Brand top bar -->
  <g opacity="0.85">
    <circle cx="85" cy="120" r="22" fill="none" stroke="#C9A96E" stroke-width="2.5"/>
    <path d="M73 120 L97 120 M85 108 L85 132" stroke="#C9A96E" stroke-width="2.5" stroke-linecap="round"/>
    <text x="130" y="115" fill="#F6F1E4" font-size="30" font-weight="700" letter-spacing="0.5">
      ধোঁয়া-মুক্ত পথ
    </text>
    <text x="130" y="148" fill="#C9A96E" font-size="22" font-weight="500">
      App 1 of 3
    </text>
  </g>

  <!-- Breath rings (concentric, symbolizing inhale–exhale) -->
  <g transform="translate(540 880)" filter="url(#soft1)" opacity="0.55">
    <circle r="380" fill="none" stroke="#C9A96E" stroke-width="2" stroke-opacity="0.25"/>
    <circle r="310" fill="none" stroke="#C9A96E" stroke-width="2" stroke-opacity="0.35"/>
    <circle r="240" fill="none" stroke="#C9A96E" stroke-width="2" stroke-opacity="0.45"/>
    <circle r="170" fill="none" stroke="#C9A96E" stroke-width="2.5" stroke-opacity="0.6"/>
  </g>
  <g transform="translate(540 880)">
    <circle r="380" fill="none" stroke="#C9A96E" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle r="310" fill="none" stroke="#C9A96E" stroke-width="1.5" stroke-opacity="0.35"/>
    <circle r="240" fill="none" stroke="#C9A96E" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle r="170" fill="none" stroke="#F6F1E4" stroke-width="2" stroke-opacity="0.9"/>
    <circle r="105" fill="#C9A96E" fill-opacity="0.18"/>
  </g>

  <!-- Central breath icon (lungs / petal) -->
  <g transform="translate(540 880)">
    <!-- 4 petals forming a flower of calm -->
    <g fill="#F6F1E4" opacity="0.92">
      <ellipse cx="0" cy="-55" rx="28" ry="70"/>
      <ellipse cx="0" cy="55"  rx="28" ry="70"/>
      <ellipse cx="-55" cy="0" rx="70" ry="28"/>
      <ellipse cx="55"  cy="0" rx="70" ry="28"/>
    </g>
    <circle r="22" fill="#C9A96E"/>
  </g>

  <!-- Headline -->
  <g text-anchor="middle">
    <text x="540" y="360" fill="#F6F1E4" font-size="96" font-weight="700">
      মুহূর্ত ব্রেথ
    </text>
    <text x="540" y="430" fill="#C9A96E" font-size="36" font-weight="500" letter-spacing="1">
      তাৎক্ষণিক শান্তির কৌশল
    </text>
  </g>

  <!-- Bottom info plate -->
  <g>
    <rect x="80" y="1410" width="920" height="360" rx="28" fill="#F6F1E4" fill-opacity="0.06"
          stroke="#C9A96E" stroke-opacity="0.45" stroke-width="1.5"/>

    <!-- Big time line -->
    <text x="540" y="1520" text-anchor="middle" fill="#F6F1E4" font-size="110" font-weight="700">
      ২১ সেকেন্ড
    </text>
    <text x="540" y="1580" text-anchor="middle" fill="#F6F1E4" opacity="0.8" font-size="32">
      যখন তলব আসে — শুধু এই সময় যথেষ্ট
    </text>

    <!-- Divider -->
    <line x1="320" y1="1625" x2="760" y2="1625" stroke="#C9A96E" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- Three benefits row -->
    <g text-anchor="middle" fill="#F6F1E4" font-size="26" font-weight="500">
      <text x="260" y="1690">• অফলাইন</text>
      <text x="540" y="1690">• কুরআনি দোয়া</text>
      <text x="820" y="1690">• বিজ্ঞানভিত্তিক</text>
    </g>
    <g text-anchor="middle" fill="#C9A96E" font-size="22" opacity="0.85">
      <text x="260" y="1730">100% Private</text>
      <text x="540" y="1730">With Audio</text>
      <text x="820" y="1730">4-7-8 Method</text>
    </g>
  </g>

  <!-- Footer brand -->
  <text x="540" y="1850" text-anchor="middle" fill="#F6F1E4" opacity="0.65" font-size="24" font-weight="500">
    smoke-free-path.pages.dev  •  তিনটি অ্যাপ • একটি যাত্রা
  </text>
</svg>
