    <g transform="translate(80 200)"><circle r="38" fill="#F1B24A" fill-opacity="0.2" stroke="#F1B24A" stroke-width="2"/><path d="M-14 0 L-4 12 L16 -14" fill="none" stroke="#F1B24A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="150" y="212" fill="#F6F1E4" font-size="34" font-weight="700">প্রগতি ট্র্যাকার</text>
    <text x="150" y="250" fill="#F6F1E4" opacity="0.8" font-size="24">টাকা-সময়-আয়ুর হিসাব রিয়েল-টাইম</text>
    <g transform="translate(80 330)"><circle r="38" fill="#F1B24A" fill-opacity="0.2" stroke="#F1B24A" stroke-width="2"/><path d="M-12 -6 L0 -14 L12 -6 L12 12 L-12 12 Z" fill="none" stroke="#F1B24A" stroke-width="3.5" stroke-linejoin="round"/></g>
    <text x="150" y="342" fill="#F6F1E4" font-size="34" font-weight="700">ব্যক্তিগত ডায়েরি</text>
