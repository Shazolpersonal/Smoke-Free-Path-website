    <g fill="#F6F1E4">
      <g fill="#F1B24A">
        <circle cx="70"  cy="195" r="10"/><circle cx="120" cy="182" r="10"/><circle cx="175" cy="170" r="10"/>
        <circle cx="230" cy="160" r="10"/><circle cx="290" cy="150" r="10"/><circle cx="350" cy="142" r="10"/>
        <circle cx="410" cy="136" r="10"/><circle cx="470" cy="132" r="10"/><circle cx="530" cy="130" r="12"/>
