<?xml version="1.0" encoding="UTF-8"?>
<!--
  ধোঁয়া-মুক্ত পথ :: পদক্ষেপ (App 2)
  Portrait demo poster — 9:16 (1080×1920)
  Concept: 41-day journey • sunrise warmth → emerald hope
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920"
     font-family="Hind Siliguri, Noto Sans Bengali, Lohit Bengali, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#F1B24A"/>
      <stop offset="28%" stop-color="#E0873A"/>
      <stop offset="62%" stop-color="#2E6A4F"/>
      <stop offset="100%" stop-color="#0B3B36"/>
    </linearGradient>
    <radialGradient id="sun2" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#FFE2A6" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#F1B24A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F1B24A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="geo2" width="140" height="140" patternUnits="userSpaceOnUse">
      <path d="M70 0 L140 70 L70 140 L0 70 Z" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.4"/>
    </pattern>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg2)"/>
  <rect width="1080" height="1920" fill="url(#geo2)"/>
  <circle cx="540" cy="560" r="460" fill="url(#sun2)"/>

  <g>
