    <g transform="translate(80 70)"><circle r="38" fill="#F1B24A" fill-opacity="0.2" stroke="#F1B24A" stroke-width="2"/><text text-anchor="middle" y="12" fill="#F1B24A" font-size="40" font-weight="700">৪১</text></g>
    <text x="150" y="82" fill="#F6F1E4" font-size="34" font-weight="700">দৈনিক চ্যালেঞ্জ</text>
