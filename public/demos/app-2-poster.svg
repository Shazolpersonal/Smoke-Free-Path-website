      <g fill="none" stroke="#F6F1E4" stroke-width="2" stroke-opacity="0.8">
        <circle cx="650" cy="132" r="9"/><circle cx="710" cy="136" r="9"/><circle cx="770" cy="142" r="9"/>
        <circle cx="830" cy="150" r="9"/><circle cx="890" cy="160" r="9"/><circle cx="950" cy="172" r="9"/>
        <circle cx="1010" cy="188" r="9"/>
