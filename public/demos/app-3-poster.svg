<?xml version="1.0" encoding="UTF-8"?>
<!--
  ধোঁয়া-মুক্ত পথ :: ৩৬৯ (App 3)
  Portrait demo poster — 9:16 (1080×1920)
  Concept: Tesla's 369 method • spiritual transformation • premium emerald+gold
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920"
     font-family="Hind Siliguri, Noto Sans Bengali, Lohit Bengali, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2C29"/><stop offset="45%" stop-color="#0E4037"/><stop offset="100%" stop-color="#1A1D25"/>
    </linearGradient>
    <radialGradient id="goldHalo" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#E7C878" stop-opacity="0.45"/><stop offset="60%" stop-color="#C9A96E" stop-opacity="0.1"/><stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="geo3" width="160" height="160" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#E7C878" stroke-opacity="0.06" stroke-width="1.2">
        <circle cx="80" cy="80" r="60"/><circle cx="80" cy="80" r="40"/>
        <path d="M0 80 L160 80 M80 0 L80 160"/><path d="M20 20 L140 140 M140 20 L20 140"/>
      </g>
    </pattern>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F7D98C"/><stop offset="100%" stop-color="#C9A96E"/></linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg3)"/>
  <rect width="1080" height="1920" fill="url(#geo3)"/>
  <rect width="1080" height="1920" fill="url(#goldHalo)"/>

  <g>
    <circle cx="85" cy="120" r="22" fill="none" stroke="#C9A96E" stroke-width="2.5"/>
    <path d="M73 120 L97 120 M85 108 L85 132" stroke="#C9A96E" stroke-width="2.5" stroke-linecap="round"/>
    <text x="130" y="115" fill="#F6F1E4" font-size="30" font-weight="700">ধোঁয়া-মুক্ত পথ</text>
    <text x="130" y="148" fill="#C9A96E" font-size="22" font-weight="500">App 3 of 3</text>
  </g>

  <g text-anchor="middle">
    <text x="540" y="560" fill="url(#goldText)" font-size="320" font-weight="700" letter-spacing="-10">৩৬৯</text>
    <text x="540" y="640" fill="#F6F1E4" font-size="32" font-weight="500" opacity="0.9">টেসলার গুপ্ত গাণিতিক নিয়ম</text>
  </g>

  <g transform="translate(540 940)">
    <g transform="translate(-220 0)"><circle r="110" fill="none" stroke="#C9A96E" stroke-width="2.5" stroke-opacity="0.85"/><circle r="80" fill="#C9A96E" fill-opacity="0.1"/><text text-anchor="middle" y="20" fill="#F7D98C" font-size="96" font-weight="700">৩</text></g>
    <g><circle r="130" fill="none" stroke="#C9A96E" stroke-width="2.5"/><circle r="100" fill="#C9A96E" fill-opacity="0.12"/><text text-anchor="middle" y="24" fill="#F7D98C" font-size="120" font-weight="700">৬</text></g>
    <g transform="translate(220 0)"><circle r="110" fill="none" stroke="#C9A96E" stroke-width="2.5" stroke-opacity="0.85"/><circle r="80" fill="#C9A96E" fill-opacity="0.1"/><text text-anchor="middle" y="20" fill="#F7D98C" font-size="96" font-weight="700">৯</text></g>
    <g fill="none" stroke="#C9A96E" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 6"><path d="M-220 0 L0 0 L220 0"/><path d="M-220 0 L0 -130 L220 0 Z"/></g>
  </g>

  <g text-anchor="middle">
