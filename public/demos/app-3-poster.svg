    <text x="460" y="100" text-anchor="middle" fill="#F7D98C" font-size="34" font-weight="700">আধ্যাত্মিক রূপান্তর</text>
    <text x="460" y="150" text-anchor="middle" fill="#F6F1E4" opacity="0.85" font-size="24">যখন ইচ্ছাশক্তি ফুরিয়ে যায়, তখন এই নিয়ম শুরু হয়</text>
    <g text-anchor="middle" fill="#F6F1E4">
      <g transform="translate(155 240)"><text y="-40" fill="#F7D98C" font-size="60" font-weight="700">৪১</text><text font-size="22" opacity="0.85">দিন ধরে</text><text y="26" font-size="22" opacity="0.85">নিয়মিত</text></g>
      <g transform="translate(460 240)"><text y="-40" fill="#F7D98C" font-size="60" font-weight="700">১৮</text><text font-size="22" opacity="0.85">বার প্রতিদিন</text><text y="26" font-size="22" opacity="0.85">(৩+৬+৯)</text></g>
      <g transform="translate(765 240)"><text y="-40" fill="#F7D98C" font-size="60" font-weight="700">১</text><text font-size="22" opacity="0.85">জীবনের</text><text y="26" font-size="22" opacity="0.85">পরিবর্তন</text></g>
    </g>
    <text x="460" y="380" text-anchor="middle" fill="#F6F1E4" opacity="0.75" font-size="22" font-style="italic">“হে রব্ব, আমাকে সুস্থতা দাও।”</text>
